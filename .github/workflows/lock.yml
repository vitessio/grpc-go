name: 'Lock Threads'

on:
  workflow_dispatch:
  schedule:
    - cron: '22 1 * * *'

permissions:
  issues: write
  pull-requests: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: dessant/lock-threads@f1a42f0f44eb83361d617a014663e1a76cf282d2
        with:
          github-token: ${{ github.token }}
          issue-lock-inactive-days: 180
          pr-lock-inactive-days: 180
